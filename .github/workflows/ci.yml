name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mgms
          POSTGRES_PASSWORD: mgms
          POSTGRES_DB: mgms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mgms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://mgms:mgms@localhost:5432/mgms_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the shared domain package
        run: npm run build --workspace @mgms/shared

      - name: Generate the Prisma client
        run: npx prisma generate --schema services/api/prisma/schema.prisma

      - name: Type-check every workspace
        run: npm run typecheck

      - name: Domain unit tests
        run: npm test --workspace @mgms/shared

      - name: API integration tests
        run: npm test --workspace @mgms/api

      - name: Build the API
        run: npm run build --workspace @mgms/api

      - name: Build the console and the field app
        run: |
          npm run build --workspace @mgms/web
          npm run build --workspace @mgms/mobile

      - name: Install a browser for the end-to-end checks
        run: npx playwright install --with-deps chromium

      # The field app is served from its production build, because the
      # service worker — and therefore the offline restart the e2e checks
      # exercise — is only registered there. It must be started through the
      # workspace script: `vite preview --config apps/mobile/vite.config.ts`
      # from the repository root resolves Vite's `root` to the cwd, so it
      # serves an empty directory and every check fails.
      - name: Seed a gathering and start the stack
        env:
          DATABASE_URL: postgresql://mgms:mgms@localhost:5432/mgms_e2e?schema=public
          JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-for-validation
          JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-for-validation
          ANALYTICS_INTERVAL_MINUTES: '0'
        run: |
          npx prisma migrate deploy --schema services/api/prisma/schema.prisma
          npm run db:seed
          npm run analytics:run
          node services/api/dist/server.js & echo $! > /tmp/api.pid
          npm run preview --workspace @mgms/mobile & echo $! > /tmp/field.pid
          timeout 60 sh -c 'until curl -sf localhost:4000/health/ready; do sleep 1; done'
          timeout 60 sh -c 'until curl -sf -o /dev/null localhost:5175; do sleep 1; done'

      - name: End-to-end checks
        env:
          MGMS_FIELD_URL: http://localhost:5175
        run: npm run test:e2e

      - name: Stop the stack
        if: always()
        run: kill "$(cat /tmp/api.pid)" "$(cat /tmp/field.pid)" 2>/dev/null || true

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build the container images
        run: |
          docker build -f services/api/Dockerfile -t mgms-api .
          docker build -f apps/web/Dockerfile -t mgms-web .
          docker build -f apps/mobile/Dockerfile -t mgms-mobile .
