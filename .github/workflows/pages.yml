name: Demonstration site

on:
  push:
    # Filtered to the default branch by the job's `if` below, so this keeps
    # working if the default branch is renamed.
    branches: ['**']
  # Any branch can publish on demand, which is how you preview before merging.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queue rather than cancel, so a push never leaves
# the published site half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mgms
          POSTGRES_PASSWORD: mgms
          POSTGRES_DB: mgms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mgms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://mgms:mgms@localhost:5432/mgms?schema=public
      JWT_ACCESS_SECRET: pages-build-secret-that-is-long-enough-for-validation
      JWT_REFRESH_SECRET: pages-build-secret-that-is-long-enough-for-validation
      ANALYTICS_INTERVAL_MINUTES: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Seed a gathering and export the snapshot
        # The demonstration data is generated here rather than committed, so
        # the published site always reflects the current seed and the
        # repository does not carry a megabyte of generated JSON.
        run: |
          npm run build --workspace @mgms/shared
          npx prisma generate --schema services/api/prisma/schema.prisma
          npx prisma migrate deploy --schema services/api/prisma/schema.prisma
          npm run db:seed
          npm run analytics:run
          npm run demo:snapshot

      - name: Build the demonstration site
        env:
          # Project Pages serve from /<repo>/, so the apps need that base baked in.
          MGMS_SITE_BASE: /${{ github.event.repository.name }}/
        run: npm run demo:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
