# Local and pilot deployment.
#
# For a state-scale rollout the database belongs on managed infrastructure with
# point-in-time recovery, and the two web tiers behind the department's own
# ingress — see docs/deployment.md.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mgms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mgms}
      POSTGRES_DB: mgms
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mgms -d mgms']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://mgms:${POSTGRES_PASSWORD:-mgms}@db:5432/mgms?schema=public
      NODE_ENV: production
      PORT: 4000
      # Generate real secrets before any deployment: openssl rand -hex 48
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
      ANALYTICS_INTERVAL_MINUTES: ${ANALYTICS_INTERVAL_MINUTES:-10}
      SYNC_STALE_MINUTES: ${SYNC_STALE_MINUTES:-60}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4000:4000'
    # Migrations run on start-up so a deploy can never serve traffic against a
    # schema it does not match.
    command: >
      sh -c "npx prisma migrate deploy --schema services/api/prisma/schema.prisma &&
             node services/api/dist/server.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - '8080:80'

  mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
    depends_on:
      - api
    ports:
      - '8081:80'

volumes:
  db-data:
